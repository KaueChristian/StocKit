# CI do StocKit (M0.5). Roda o mesmo comando de qualidade usado localmente: python tools/check.py
# Actions fixadas por hash de commit (a tag fica no comentário). Só versões com 14+ dias de publicação (§19).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  HYPOTHESIS_PROFILE: ci  # determinístico e com mais exemplos (tests/conftest.py)

defaults:
  run:
    shell: bash  # igual no Linux e no Windows; para no primeiro erro (set -eo pipefail)

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linux: ambiente padrão de CI. Windows: plataforma do desktop e do .exe (M3).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python (versão de .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar core (editável) e ferramentas de dev
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e . --group dev

      - name: Check (ruff, mypy, import-linter, pytest + cobertura)
        run: python tools/check.py

  hygiene:
    name: higiene (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python (versão de .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar pre-commit
        run: python -m pip install pre-commit==4.7.0

      # Ganchos que o job "check" já cobre ficam de fora para não rodar duas vezes.
      - name: Ganchos de higiene (espaços, fim de arquivo, YAML/TOML, workflows)
        env:
          SKIP: ruff-check,ruff-format,mypy,import-linter,pytest
        run: python -m pre_commit run --all-files --show-diff-on-failure
